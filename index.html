<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111b18" />
    <meta name="description" content="Dịch vụ Roblox của Hào VTT" />
    <title>Hào VTT | Dịch vụ Roblox</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="cover" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>

      <main class="profile" aria-label="Trang liên kết Hào VTT">
        <div class="topbar">
          <a class="brand" href="https://www.youtube.com/@haovtt1" target="_blank" rel="noreferrer" aria-label="Mở kênh YouTube Hào VTT">
            <span class="brand-mark">H</span>
            <span>HAO VTT</span>
          </a>
          <button class="share-button" type="button" aria-label="Chia sẻ trang" data-share>
            <span class="share-icon">↗</span>
          </button>
        </div>

        <section class="identity">
          <div class="avatar-wrap">
            <img class="avatar" src="https://yt3.googleusercontent.com/Gw6bbYDngzNQjKSMDN7w26TYqv9YmdfZdMx9H93D2Z0PZCjCvUmOc0iSMTvgxzJT9XIYKPm5Zw=s900-c-k-c0x00ffffff-no-rj" alt="Avatar kênh Hào VTT" />
            <span class="verified" aria-label="Đã xác minh">✓</span>
          </div>
          <h1>Hào VTT</h1>
          <p class="handle">@haovtt1</p>
          <p class="intro">Dịch vụ Roblox nhanh, gọn và uy tín<br />Chơi vui hơn, nạp dễ hơn.</p>
        </section>

        <p class="promo-code">Nhập mã : HAOVTT1 <span>·</span> để giảm 10% bạn nha</p>

        <section class="links" aria-label="Các liên kết dịch vụ">
          <a class="link-card featured" href="https://topup.goslynk.com/" target="_blank" rel="noreferrer">
            <span class="link-icon roblox-icon"><img class="service-logo" src="https://topup.goslynk.com/logo.png" alt="GosLynk" /></span>
            <span class="link-copy"><strong>Dịch vụ Roblox</strong><small>Top up nhanh chóng & an toàn</small></span>
            <span class="arrow">→</span>
          </a>
          <a class="link-card" href="https://topup.goslynk.com/product/?id=20" target="_blank" rel="noreferrer">
            <span class="link-icon egg-icon"><img class="game-logo" src="https://topgames.gg/data/image/game/steal-an-egg.png" alt="Steal An Egg" /></span>
            <span class="link-copy"><strong>Dịch vụ hỗ trợ game</strong><small>Hỗ trợ trải nghiệm Steal An Egg</small></span>
            <span class="arrow">→</span>
          </a>
        </section>

        <footer>
          <span class="status-dot"></span>
          <span>Đang online</span>
          <span class="footer-divider">•</span>
          <a href="https://www.youtube.com/@haovtt1" target="_blank" rel="noreferrer">YouTube</a>
        </footer>
      </main>
      <div class="toast" role="status" aria-live="polite">Đã sao chép liên kết</div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
